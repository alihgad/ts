services:
  api:
    build: .
    container_name: api
    init: true
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000

    networks:
      - backend
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  mongo:
    image: mongo:8.0
    container_name: mongo
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  backend:
    
